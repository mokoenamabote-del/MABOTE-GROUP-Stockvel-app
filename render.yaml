services:
  - type: web
    name: mabote-group-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://www.mabotegroup.co.za
      - key: DATABASE_PATH
        value: /var/data/mabote.sqlite
    disk:
      name: mabote-data
      mountPath: /var/data
      sizeGB: 1
